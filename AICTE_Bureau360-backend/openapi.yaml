openapi: '3.0.3'
info:
  title: AICTE Bureau360 API
  version: 1.0.0
  description: |
    Integrated complaint tracking and institution monitoring dashboard for AICTE.
    Built for Smart India Hackathon (SIH26264).
  contact:
    name: Bureau360 Team
servers:
  - url: http://localhost:3000/api/v1
    description: Local development

paths:
  /auth/login:
    post:
      summary: User login
      description: Authenticates user credentials and returns JWT access and refresh tokens.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@aicte.gov.in
                password:
                  type: string
                  example: Admin@123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { type: object }
                      tokens:
                        type: object
                        properties:
                          access_token: { type: string }
                          refresh_token: { type: string }
                          expires_in: { type: string }
        '401':
          description: Invalid credentials
        '429':
          description: Too many login attempts

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New tokens issued
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      summary: User logout
      description: Revokes the refresh token.
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Logged out successfully

  /auth/me:
    get:
      summary: Current user profile
      tags: [Auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user details

  /health:
    get:
      summary: Health check
      description: Returns API and database status.
      tags: [System]
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      timestamp:
                        type: string
                        format: date-time
                      database:
                        type: string
                        example: connected
        '503':
          description: Database unreachable

  /meta:
    get:
      summary: Get all reference data
      description: Returns categories, statuses, priorities, sources, bureaus, regions, roles, and status transition map.
      tags: [Meta]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: All reference data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /institutions:
    get:
      summary: List institutions
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Fuzzy name search or AICTE ID prefix
        - name: state
          in: query
          schema: { type: string }
        - name: region_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, CLOSED, SUSPENDED, WITHDRAWN] }
        - name: institution_type
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: [name, aicte_id, state, created_at], default: name }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Paginated list of institutions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Institution'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Create institution
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstitution'
      responses:
        '201':
          description: Institution created
        '409':
          description: Duplicate AICTE ID

  /institutions/search:
    get:
      summary: Autocomplete search
      description: Returns top 10 matches by name similarity or AICTE ID prefix.
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Autocomplete results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        aicte_id: { type: string }
                        name: { type: string }
                        city: { type: string }
                        state: { type: string }

  /institutions/import:
    post:
      summary: CSV import (admin)
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import results with inserted/skipped/error counts

  /institutions/{aicteId}:
    get:
      summary: Get institution by AICTE ID
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AicteId'
      responses:
        '200':
          description: Institution detail
        '404':
          description: Not found
    patch:
      summary: Update institution
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AicteId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstitution'
      responses:
        '200':
          description: Updated institution
        '404':
          description: Not found

  /institutions/{aicteId}/history:
    get:
      summary: Institution change history
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AicteId'
      responses:
        '200':
          description: History entries

  /institutions/{aicteId}/documents:
    get:
      summary: List institution documents
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AicteId'
      responses:
        '200':
          description: Document list
    post:
      summary: Upload institution documents
      tags: [Institutions]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AicteId'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                doc_category:
                  type: string
                  enum: [SUPPORTING, ACTION_TAKEN_REPORT, INSTITUTION_DOC, OTHER]
                  default: INSTITUTION_DOC
      responses:
        '201':
          description: Documents uploaded

  /complaints:
    get:
      summary: List complaints with filters
      description: Returns complaints visible within the user's scope (ALL, BUREAU, REGION, or ASSIGNED)
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Full-text search, complaint_no, or institution name
        - name: status
          in: query
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: priority
          in: query
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        - name: aicte_id
          in: query
          schema: { type: string }
        - name: bureau_id
          in: query
          schema: { type: integer }
        - name: assignee_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
          description: received_on >= from
        - name: to
          in: query
          schema: { type: string, format: date }
          description: received_on <= to
        - name: overdue
          in: query
          schema: { type: boolean }
          description: sla_due_at < now AND status is open
        - name: has_overlap
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, updated_at, received_on, priority, status, sla_due_at, complaint_no] }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated complaint list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Complaint'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Create a new complaint
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaint'
      responses:
        '201':
          description: Complaint created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Complaint'
        '404':
          description: Institution not found

  /complaints/{id}:
    get:
      summary: Get complaint detail
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: Complaint detail with allowed_next_statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Complaint'
        '404':
          description: Not found or outside scope
    patch:
      summary: Update complaint fields
      description: Updates title, description, category, priority, or complainant info. Records FIELD_UPDATED action.
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComplaint'
      responses:
        '200':
          description: Updated complaint
        '404':
          description: Not found

  /complaints/{id}/status:
    patch:
      summary: Change complaint status
      description: Validates status transition map and remarks requirements
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [NEW, UNDER_REVIEW, ASSIGNED, IN_PROGRESS, PENDING_INFO, ESCALATED, RESOLVED, CLOSED, REJECTED, REOPENED]
                remarks:
                  type: string
                  description: Required for REJECTED, RESOLVED, CLOSED, REOPENED, ESCALATED
      responses:
        '200':
          description: Status updated
        '400':
          description: Invalid transition or missing remarks

  /complaints/{id}/remarks:
    post:
      summary: Add a remark (comment)
      description: Adds a remark without changing status. Can be internal (hidden from other bureaus).
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remarks]
              properties:
                remarks:
                  type: string
                  minLength: 1
                is_internal:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Remark added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ComplaintAction'

  /complaints/{id}/timeline:
    get:
      summary: Get complaint timeline (action history)
      description: Returns actions in chronological order. Filters is_internal actions based on caller's bureau.
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: Action timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplaintAction'

  /complaints/{id}/assign:
    post:
      summary: Assign complaint to bureau or officer
      description: Assigns a complaint to a specific bureau and/or officer. Deactivates previous assignment and logs ASSIGNED action.
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignComplaint'
      responses:
        '200':
          description: Complaint assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Complaint'
        '400':
          description: Validation error (e.g. neither bureau nor assignee provided)
        '404':
          description: Complaint, bureau, or user not found

  /complaints/{id}/transfer:
    post:
      summary: Transfer complaint to another bureau
      description: Transfers case ownership to a different bureau with required justification reason. Recomputes SLA if target bureau has a specific rule.
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferComplaint'
      responses:
        '200':
          description: Complaint transferred successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Complaint'
        '400':
          description: Cannot transfer closed complaint or transfer to same bureau
        '404':
          description: Complaint or target bureau not found

  /complaints/{id}/assignments:
    get:
      summary: Get assignment history
      description: Returns chronological history of case assignments and bureau transfers with officer and bureau names.
      tags: [Complaints]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: Assignment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplaintAssignment'

  /complaints/{id}/documents:
    post:
      summary: Upload supporting documents
      description: Uploads files (PDF, JPG, PNG up to 10MB each, max 5 per request). Computes and stores SHA-256 checksum.
      tags: [Documents]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                doc_category:
                  type: string
                  enum: [SUPPORTING, ACTION_TAKEN_REPORT, INSTITUTION_DOC, OTHER]
                  default: SUPPORTING
      responses:
        '201':
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplaintDocument'
        '400':
          description: No files uploaded or disallowed file type
    get:
      summary: List documents for complaint
      description: Returns all documents attached to the complaint.
      tags: [Documents]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplaintDocument'

  /complaints/{id}/documents/{documentId}:
    get:
      summary: Get document metadata
      description: Returns metadata of a specific complaint document.
      tags: [Documents]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ComplaintDocument'
        '404':
          description: Complaint or document not found

  /complaints/{id}/documents/{documentId}/download:
    get:
      summary: Download document file
      description: Streams the document binary file with Content-Disposition attachment header.
      tags: [Documents]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: File download stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found

  /overlaps/detect:
    post:
      summary: Detect overlaps for a complaint
      description: Runs rule-based and ML similarity checks against existing complaints. Creates links and match reasons.
      tags: [Overlaps]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [complaint_id]
              properties:
                complaint_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Detection results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      links_created: { type: integer }
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/OverlapLink'

  /overlaps:
    get:
      summary: List pending overlap links for review
      tags: [Overlaps]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: review_status
          in: query
          schema: { type: string, enum: [PENDING_REVIEW, CONFIRMED, DISMISSED], default: PENDING_REVIEW }
        - name: institution_id
          in: query
          schema: { type: string, format: uuid }
        - name: bureau_id
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated overlap links
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OverlapLink'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /overlaps/dashboard:
    get:
      summary: Overlap dashboard statistics
      tags: [Overlaps]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Overlap summary metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /overlaps/complaint/{complaintId}:
    get:
      summary: Get overlap links for a specific complaint
      tags: [Overlaps]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: complaintId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Overlap links for complaint
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OverlapLink'

  /overlaps/{linkId}/review:
    patch:
      summary: Review overlap link (confirm or dismiss)
      tags: [Overlaps]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [CONFIRMED, DISMISSED]
      responses:
        '200':
          description: Link review status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OverlapLink'

  /notifications:
    get:
      summary: Get user notifications (inbox)
      tags: [Notifications]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /notifications/unread-count:
    get:
      summary: Get user's unread notification count
      tags: [Notifications]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread_count: { type: integer }

  /notifications/read-all:
    patch:
      summary: Mark all notifications as read
      tags: [Notifications]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: All notifications marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: integer }

  /notifications/{id}/read:
    patch:
      summary: Mark a single notification as read
      tags: [Notifications]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'

  /reports/dashboard:
    get:
      summary: Executive dashboard overview
      tags: [Dashboard]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBureauId'
      responses:
        '200':
          description: Dashboard summary KPIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /reports/bureaus:
    get:
      summary: Bureau-wise breakdown report
      tags: [Dashboard]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: Bureau breakdown stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /reports/regions:
    get:
      summary: Region-wise breakdown report
      tags: [Dashboard]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: Region breakdown stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /reports/overlaps:
    get:
      summary: Overlap intelligence analytics report
      tags: [Dashboard]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Overlap metrics and review stats
          content:
            application/json:
              schema:
                type: object
