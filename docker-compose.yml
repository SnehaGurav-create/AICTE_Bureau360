version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bureau360
      POSTGRES_PASSWORD: bureau360
      POSTGRES_DB: bureau360
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run schema.sql automatically on first launch
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bureau360']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bureau360:bureau360@db:5432/bureau360
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
